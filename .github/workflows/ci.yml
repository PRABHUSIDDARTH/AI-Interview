name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build & Regression Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Backend Compilation
        run: python -m compileall backend/app

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: npm run build

      - name: Start FastAPI Backend
        run: |
          export AI_PROVIDER=mock
          export SECRET_KEY="ci_test_secret_key_1234567890"
          export DATABASE_URL="sqlite:///./sql_app.db"
          export ENVIRONMENT="test"
          python -m uvicorn app.main:app --app-dir backend --port 8000 &

      - name: Wait for Backend Health Check
        run: |
          python -c "
          import time, requests, sys
          print('Waiting for backend server to become healthy...')
          for attempt in range(30):
              try:
                  res = requests.get('http://127.0.0.1:8000/health', timeout=2)
                  if res.status_code == 200:
                      print(f'Backend ready on attempt {attempt + 1}: {res.json()}')
                      sys.exit(0)
              except Exception:
                  pass
              time.sleep(1)
          print('Error: Backend service failed to start within 30 seconds.', file=sys.stderr)
          sys.exit(1)
          "

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build

      - name: Run End-to-End Regression Suite
        env:
          AI_PROVIDER: mock
          PYTHONIOENCODING: utf-8
        run: python regression_test.py

